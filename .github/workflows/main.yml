name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/cink
            git fetch origin main
            git reset --hard origin/main
            cd ~/apps
            # Only rebuild and restart cink container
            docker compose build cink
            docker compose up -d cink
            # Verify deployment
            sleep 5
            docker compose ps cink
            echo "Deploy complete - cink updated"
