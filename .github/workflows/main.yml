name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/cink
            git stash
            git pull origin main
            cd ~/apps
            # Stop running cink container
            docker compose stop cink || true
            # Remove the stopped container
            docker compose rm -f cink || true
            # Clean up any orphaned containers
            docker ps -a | grep apps-cink || true
            # Build and start fresh
            docker compose build --no-cache cink
            docker compose up -d cink
            # Wait for container to be healthy
            sleep 5
            # Clean up unused images
            docker image prune -f
            echo "Deploy complete"
