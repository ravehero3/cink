name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/cink
            git fetch origin main
            git reset --hard origin/main
            cd ~/apps
            # Stop watchdog during deploy to prevent restart races
            docker stop ufosport-watchdog 2>/dev/null || true
            # Clean up any stale or conflicting cink containers
            docker ps -a --format '{{.ID}} {{.Names}}' | grep -E 'cink|apps-cink' | awk '{print $1}' | xargs -r docker rm -f 2>/dev/null || true
            # Rebuild cink image
            docker compose build cink
            # Ensure container is fully removed before starting new one
            docker compose stop cink 2>/dev/null || true
            docker compose rm -f -v cink 2>/dev/null || true
            docker ps -a --format '{{.ID}} {{.Names}}' | grep -E 'cink|apps-cink' | awk '{print $1}' | xargs -r docker rm -f 2>/dev/null || true
            # Start cink cleanly, then ensure all services are running
            docker compose up -d cink
            docker compose up -d
            # Verify deployment
            sleep 10
            docker compose ps
            echo "Deploy complete - all services running"
