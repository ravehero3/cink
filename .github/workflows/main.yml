name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/cink
            git fetch origin main
            git reset --hard origin/main
            cd ~/apps
            # Pause watchdog during deploy to prevent restart races
            sudo systemctl stop ufosport-watchdog 2>/dev/null || true
            docker stop ufosport-watchdog 2>/dev/null || true
            # Rebuild cink image while current container continues running
            docker compose build cink
            # Gracefully stop and remove old cink container
            docker stop apps-cink-1 -t 5 2>/dev/null || true
            docker rm -f apps-cink-1 2>/dev/null || true
            docker ps -a --format '{{.ID}} {{.Names}}' | grep -E 'apps-cink' | awk '{print $1}' | xargs -r docker rm -f 2>/dev/null || true
            # Wait for Docker daemon to finish removal before starting new container
            for i in $(seq 1 10); do
              docker ps -a --format '{{.Names}}' | grep -q 'apps-cink' || break
              sleep 1
            done
            # Start cink with new image cleanly
            docker compose up -d cink
            # Ensure all other services are running
            docker compose up -d
            # Resume watchdog
            sudo systemctl start ufosport-watchdog 2>/dev/null || true
            # Verify deployment
            sleep 10
            docker compose ps
            echo "Deploy complete - all services running"
