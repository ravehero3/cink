name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/cink
            git fetch origin main
            git reset --hard origin/main
            cd ~/apps
            # Force-remove any stale cink containers by name pattern to avoid conflicts
            docker ps -a --filter "name=cink" --format "{{.ID}}" | xargs -r docker rm -f
            # Rebuild cink image
            docker compose build cink
            # Bring up only cink (leaves other services untouched)
            docker compose up -d --force-recreate cink
            # Verify deployment
            sleep 10
            docker compose ps
            echo "Deploy complete - cink service updated"
